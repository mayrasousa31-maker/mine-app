<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Coquete ??</title>

<style>
body {
    background: linear-gradient(135deg, #ff9ecf, #ffcce6);
    font-family: 'Comic Sans MS', cursive;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
}

.card {
    background: white;
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
    width: 320px;
    animation: aparecer 0.8s ease;
}

h2 {
    color: #ff4da6;
    margin-bottom: 20px;
}

input {
    padding: 10px;
    border-radius: 20px;
    border: 2px solid #ff80bf;
    outline: none;
    width: 80%;
    text-align: center;
}

button {
    margin-top: 15px;
    padding: 10px 20px;
    border-radius: 20px;
    border: none;
    background: #ff4da6;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ff1a8c;
    transform: scale(1.05);
}

#resultado {
    margin-top: 20px;
    font-size: 20px;
    color: #ff0066;
    font-weight: bold;
    animation: brilho 1s infinite alternate;
}

@keyframes aparecer {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
}

@keyframes brilho {
    from { text-shadow: 0 0 5px #ff99cc; }
    to { text-shadow: 0 0 15px #ff3399; }
}

/* Corações caindo */
.coracao {
    position: fixed;
    top: -10px;
    font-size: 20px;
    animation: cair linear infinite;
}

@keyframes cair {
    to {
        transform: translateY(110vh);
    }
}
</style>
</head>

<body>

<div class="card">
    <h2>Digite seu nome ??</h2>
    <input type="text" id="nome" placeholder="Seu nome aqui">
    <br>
    <button onclick="mostrarNome()">Enviar ??</button>
    <div id="resultado"></div>
</div>

<script>
function mostrarNome() {
    let nome = document.getElementById("nome").value;
    if(nome.trim() !== "") {
        document.getElementById("resultado").innerText = "?? " + nome + " broxa ??";
    } else {
        document.getElementById("resultado").innerText = "Digite um nome, amorzinho ??";
    }
}

/* Criar corações caindo */
function criarCoracao() {
    const coracao = document.createElement("div");
    coracao.classList.add("coracao");
    coracao.innerText = "??";
    coracao.style.left = Math.random() * 100 + "vw";
    coracao.style.animationDuration = (Math.random() * 3 + 2) + "s";
    document.body.appendChild(coracao);

    setTimeout(() => {
        coracao.remove();
    }, 5000);
}

setInterval(criarCoracao, 300);
</script>

</body>
</html>
